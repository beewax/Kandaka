name: News Refresh (frequent)

# Runs fetch_news.py on a tighter schedule than the once-daily image/full
# rebuild workflow (daily-rebuild.yml), since news RSS feeds update
# throughout the day but the "Sudan in Images" picks are date-seeded and
# only need refreshing once per day. Every 3 hours = 8 runs/day; GitHub
# Actions minutes are unlimited for public repos, so this costs nothing.
# git push here also triggers Netlify's normal git-based auto-deploy,
# same as daily-rebuild.yml already does.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch news articles
        run: python scripts/fetch_news.py

      - name: Commit and push new content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/news/
          git diff --cached --quiet || git commit -m "Auto: fetch news $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
