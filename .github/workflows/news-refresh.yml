name: News Refresh (frequent)

# Runs fetch_news.py on a tighter schedule than the once-daily image/full
# rebuild workflow (daily-rebuild.yml), since news RSS feeds update
# throughout the day but the "Sudan in Images" picks are date-seeded and
# only need refreshing once per day. Every 3 hours = 8 runs/day; GitHub
# Actions minutes are unlimited for public repos, so this costs nothing.
# git push here also triggers Netlify's normal git-based auto-deploy,
# same as daily-rebuild.yml already does.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch news articles
        run: python scripts/fetch_news.py

      - name: Commit and push new content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/news/
          git diff --cached --quiet || git commit -m "Auto: fetch news $(date -u '+%Y-%m-%d %H:%M UTC')"

          # git push occasionally fails on GitHub-hosted runners with a
          # transient "Failure when receiving data from the peer" network
          # error that has nothing to do with the commit itself (seen in
          # run #2, Aug 2026). Retry with backoff, rebasing onto origin/main
          # first in case another workflow pushed in between attempts.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "git push failed (attempt $attempt/5), retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done
          echo "git push failed after 5 attempts"
          exit 1
