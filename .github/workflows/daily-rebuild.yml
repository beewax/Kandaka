name: Fetch Sudan Images

# NOTE (August 2026): news fetching was split out to news-refresh.yml, which
# runs every 3 hours instead of once daily -- news RSS feeds update through
# the day, but fetch_images.py's picks are date-seeded (today_seed()) so
# there's nothing to gain from running it more than once daily; it would
# just burn API calls re-picking the same candidate and hitting the
# "Already exists" skip. This workflow (name kept from its original,
# slightly misleading "daily-rebuild" title -- it fetches images, it isn't
# itself a rebuild trigger) stays on the once-daily cadence.

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC = 9 AM Sudan time
  workflow_dispatch:

jobs:
  fetch-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch Sudan images
        env:
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          DPLA_API_KEY: ${{ secrets.DPLA_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
        run: python scripts/fetch_images.py

      - name: Commit and push new content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/images/
          git diff --cached --quiet || git commit -m "Auto: fetch images $(date -u '+%Y-%m-%d')"
          git push
