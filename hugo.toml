baseURL = "https://kandaka.com/"
title = "Kandaka"
theme = "PaperMod"
defaultContentLanguage = "en"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pygmentsUseClasses = true
pygmentsCodeFences = true

[services.googleAnalytics]
  ID = "G-MQ6B4L68WB"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS", "Pinterest"]

[outputFormats.Pinterest]
  mediaType = "application/rss+xml"
  baseName = "pinterest"
  isPlainText = true
  notAlternative = true

# LANGUAGE: ENGLISH
[languages.en]
  languageCode = "en"
  languageName = "English"
  languageDirection = "ltr"
  weight = 1
  title = "Kandaka"

  [languages.en.params]
    description = "Sudan news, analysis, and a digital library of scholarship on the country."
    [languages.en.params.footer]
      text = "[About](/about/) - [Contact](mailto:admin@kandaka.com)"
  [[languages.en.menu.main]]
    identifier = "ideas"
    name = "Ideas"
    url = "/ideas/"
    weight = 10

  [[languages.en.menu.main]]
    identifier = "development"
    name = "Development"
    url = "/development/"
    weight = 20

  [[languages.en.menu.main]]
    identifier = "history"
    name = "History"
    url = "/history/"
    weight = 30

  [[languages.en.menu.main]]
    identifier = "culture"
    name = "Culture"
    url = "/culture/"
    weight = 40

  [[languages.en.menu.main]]
    identifier = "news"
    name = "News"
    url = "/news/"
    weight = 50

  [[languages.en.menu.main]]
    identifier = "library"
    name = "Library"
    url = "/library/"
    weight = 60

  [[languages.en.menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 70

  [[languages.en.menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 80

# LANGUAGE: ARABIC
[languages.ar]
  languageCode = "ar"
  languageName = "العربية"
  languageDirection = "rtl"
  weight = 2
  title = "كاندكة"

  [languages.ar.params]
    description = "تحليلات وأخبار السودان ومكتبة رقمية للدراسات المتعلقة بالبلاد."
    [languages.ar.params.footer]
      text = "[حول](/ar/about/) - [تواصل](mailto:admin@kandaka.com)"
  [[languages.ar.menu.main]]
    identifier = "ideas"
    name = "أفكار"
    url = "/ar/ideas/"
    weight = 10

  [[languages.ar.menu.main]]
    identifier = "development"
    name = "التنمية"
    url = "/ar/development/"
    weight = 20

  [[languages.ar.menu.main]]
    identifier = "history"
    name = "التاريخ"
    url = "/ar/history/"
    weight = 30

  [[languages.ar.menu.main]]
    identifier = "culture"
    name = "الثقافة"
    url = "/ar/culture/"
    weight = 40

  [[languages.ar.menu.main]]
    identifier = "news"
    name = "الأخبار"
    url = "/ar/news/"
    weight = 50

  [[languages.ar.menu.main]]
    identifier = "library"
    name = "المكتبة"
    url = "/ar/library/"
    weight = 60

  [[languages.ar.menu.main]]
    identifier = "about"
    name = "حول"
    url = "/ar/about/"
    weight = 70

  [[languages.ar.menu.main]]
    identifier = "search"
    name = "بحث"
    url = "/ar/search/"
    weight = 80

[params]
  env = "production"
  author = "Kandaka"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/beewax/Kandaka"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/kandaka"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
